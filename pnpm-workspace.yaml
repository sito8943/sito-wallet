# Config de pnpm para v11 (v11 ya no lee el campo "pnpm" de package.json).
# El campo en package.json se mantiene a proposito: pnpm 10 le da precedencia,
# asi que hoy nada cambia. Al pasar a pnpm 11 este archivo toma el relevo.
# Los valores DEBEN quedar identicos en ambos lados.

packages:
  - "."

# reemplaza onlyBuiltDependencies (eliminado en v11)
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true

overrides:
  tar: 7.5.8
  glob: 14.0.3
  undici: 7.30.1
  minimatch: 11.0.4
  follow-redirects: 1.16.2
  axios: 1.20.0
  source-map-js: 1.2.2

# TS 7 es valido; i18next/react-i18next aun declaran peer typescript@^5
peerDependencyRules:
  allowedVersions:
    "i18next>typescript": "7"
    "react-i18next>typescript": "7"

# Fix de dialogos anidados (lib dashboard-app, pendiente de publicar 0.4.2)
patchedDependencies:
  "@sito/dashboard-app@0.4.1": patches/@sito__dashboard-app@0.4.1.patch
